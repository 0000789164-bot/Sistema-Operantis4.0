<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operantis 4.0 — Painel Multiempresa</title><style>body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f4f6f9;color:#263238;display:flex;min-height:100vh}.side{width:250px;background:#003d82;color:#fff;padding:18px 0}.brand{text-align:center;font-size:20px;font-weight:700;padding:12px;border-bottom:1px solid #ffffff22}.company{text-align:center;padding:14px;background:#0056b3;margin:12px;border-radius:8px}.company small{display:block;opacity:.8}.nav button{display:block;width:100%;border:0;background:none;color:#dce7ef;padding:13px 18px;text-align:left;cursor:pointer}.nav button.active,.nav button:hover{background:#0056b3;color:#fff}.main{flex:1;padding:22px;overflow:auto}.top{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:16px 20px;border-radius:8px;box-shadow:0 2px 7px #0001;margin-bottom:18px}.top h1{margin:0;font-size:1.3rem}.top button{border:0;border-radius:6px;padding:9px 13px;cursor:pointer}.switch{background:#ffc107}.logout{background:#dc3545;color:#fff}.tabs{display:none}.tabs.active{display:block}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}.card,.panel{background:#fff;border-radius:8px;box-shadow:0 2px 7px #0001;padding:17px;margin-bottom:17px}.card small{display:block;color:#6c757d;text-transform:uppercase;font-weight:700}.card strong{font-size:1.7rem;color:#003d82}.head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding-bottom:10px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:.8rem;font-weight:700;color:#6c757d}input,select{padding:9px;border:1px solid #ccd2d7;border-radius:5px}.btn{background:#0056b3;color:#fff;border:0;border-radius:5px;padding:9px 14px;font-weight:700;cursor:pointer}table{width:100%;border-collapse:collapse;font-size:.84rem}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left}th{background:#f8f9fa;color:#6c757d}.badge{padding:4px 8px;border-radius:12px;font-size:.7rem;font-weight:700}.ok{background:#d1e7dd;color:#0f5132}.warn{background:#fff3cd;color:#664d03}.danger{background:#f8d7da;color:#842029}.admin{display:none}.admin.show{display:inline-block}.notice{padding:10px 13px;background:#e9f2ff;border-left:4px solid #0056b3;border-radius:5px;margin-bottom:15px}@media(max-width:750px){.side{width:190px}.main{padding:10px}.top{flex-direction:column;gap:10px;align-items:flex-start}}</style></head><body><aside class="side"><div class="brand">🔧 OPERANTIS 4.0</div><div class="company"><small>EMPRESA ATIVA</small><strong id="empresa">—</strong></div><nav class="nav"><button class="active" onclick="showTab('dashboard',this)">📊 Dashboard</button><button onclick="showTab('equipamentos',this)">🚜 Equipamentos</button><button onclick="showTab('os',this)">📋 Ordens de Serviço</button><button onclick="showTab('pcm',this)">🗓️ Planejamento / PCM</button><button onclick="showTab('estoque',this)">📦 Peças & Estoque</button><button onclick="showTab('historico',this)">⚠️ Falhas & Histórico</button></nav></aside><main class="main"><div class="top"><h1 id="titulo">Dashboard & Indicadores</h1><div><button id="switch" class="switch admin" onclick="trocarEmpresa()">Trocar empresa</button> <button class="logout" onclick="logout()">Sair</button></div></div><div id="app"></div></main><script>const SKEY='operantisMultiEmpresaV1';const sess=JSON.parse(sessionStorage.getItem('operantisSession')||'null');if(!sess){location.href='login.html'}const seeds={SENAI:{equipamentos:[['SEN-EQ-001','Torno CNC Romi','Usinagem',1240,1500],['SEN-EQ-002','Compressor Schulz','Manutenção',790,800],['SEN-EQ-003','Prensa Hidráulica','Oficina',540,700]],os:[['OS-SEN-001','SEN-EQ-002','Preventiva','Troca de filtro e óleo','Carlos','Aberta'],['OS-SEN-002','SEN-EQ-001','Corretiva','Vibração no eixo','Marcos','Em execução']],pcm:[['2026-09-02','SEN-EQ-001','Preventiva','Lubrificação e inspeção','Carlos','Alta','Programada'],['2026-09-05','SEN-EQ-002','Inspeção','Verificar pressão','Ana','Média','Programada']],estoque:[['SEN-P-001','Óleo hidráulico ISO 46',32,10,48],['SEN-P-002','Filtro de óleo',7,4,92],['SEN-P-003','Correia industrial A-42',2,5,76]],historico:[['2026-08-20 08:30','SEN-EQ-002','Falha','Superaquecimento','Filtro de óleo',92],['2026-08-18 14:10','SEN-EQ-001','Preventiva','Lubrificação do eixo','Graxa EP2',38]]},VALE:{equipamentos:[['VAL-EQ-101','Escavadeira CAT 320','Mina',4850,5000],['VAL-EQ-102','Caminhão fora de estrada','Transporte',7380,7500],['VAL-EQ-103','Britador primário','Beneficiamento',2910,3000],['VAL-EQ-104','Bomba de polpa','Processo',1640,1800]],os:[['OS-VAL-101','VAL-EQ-101','Corretiva','Vazamento hidráulico','João','Aberta'],['OS-VAL-102','VAL-EQ-103','Preventiva','Inspeção de correias','Rafael','Concluída'],['OS-VAL-103','VAL-EQ-104','Preditiva','Análise de vibração','Fernanda','Em execução']],pcm:[['2026-09-01','VAL-EQ-101','Corretiva','Reparo do circuito hidráulico','João','Crítica','Programada'],['2026-09-03','VAL-EQ-103','Preventiva','Troca de correias','Rafael','Alta','Programada'],['2026-09-08','VAL-EQ-104','Preditiva','Coleta de vibração','Fernanda','Média','Programada']],estoque:[['VAL-P-101','Mangueira hidráulica 3/4',3,6,165],['VAL-P-102','Filtro combustível diesel',11,5,72],['VAL-P-103','Correia transportadora',1,4,420],['VAL-P-104','Rolamento 6308',4,3,78]],historico:[['2026-08-22 10:20','VAL-EQ-101','Falha','Baixa pressão hidráulica','Mangueira 3/4',165],['2026-08-21 16:40','VAL-EQ-103','Preventiva','Inspeção de correias','Correia transportadora',420],['2026-08-19 09:15','VAL-EQ-104','Falha','Vibração acima do limite','Rolamento 6308',78]]}};let db=JSON.parse(localStorage.getItem(SKEY)||'null');if(!db){db=JSON.parse(JSON.stringify(seeds));localStorage.setItem(SKEY,JSON.stringify(db))}let empresa=sess.role==='admin'?'SENAI':sess.empresa;function data(){return db[empresa]}function save(){localStorage.setItem(SKEY,JSON.stringify(db))}function showTab(id,btn){document.querySelectorAll('.tabs').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');btn.classList.add('active');document.getElementById('titulo').textContent={dashboard:'Dashboard & Indicadores',equipamentos:'Gestão de Equipamentos',os:'Ordens de Serviço',pcm:'Planejamento e Controle de Manutenção',estoque:'Peças & Estoque',historico:'Falhas & Histórico'}[id];render(id)}function table(headers,rows){return '<table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}function render(id){const d=data();let h='';if(id==='dashboard'){const crit=d.estoque.filter(x=>x[2]<x[3]).length;h='<div class="notice">Dados isolados da empresa <b>'+empresa+'</b>. O usuário da outra empresa não utiliza este conjunto de dados.</div><div class="cards"><div class="card"><small>Equipamentos</small><strong>'+d.equipamentos.length+'</strong></div><div class="card"><small>OS</small><strong>'+d.os.length+'</strong></div><div class="card"><small>PCM</small><strong>'+d.pcm.length+'</strong></div><div class="card"><small>Estoque crítico</small><strong>'+crit+'</strong></div></div><div class="panel"><div class="head"><h3>Resumo de ativos</h3></div>'+table(['TAG','Equipamento','Setor','Horímetro','Limite'],d.equipamentos)+'</div>'}else if(id==='equipamentos'){h='<div class="panel"><div class="head"><h3>Equipamentos de '+empresa+'</h3></div><form id="eqform" class="grid"><div class="field"><label>TAG</label><input id="e1" required></div><div class="field"><label>Nome</label><input id="e2" required></div><div class="field"><label>Setor</label><input id="e3" required></div><div class="field"><label>Horímetro</label><input id="e4" type="number" required></div><div class="field"><label>Limite</label><input id="e5" type="number" required></div><div><button class="btn">Adicionar</button></div></form></div><div class="panel">'+table(['TAG','Equipamento','Setor','Horímetro','Limite'],d.equipamentos)+'</div>'}else if(id==='os'){h='<div class="panel"><div class="head"><h3>Ordens de Serviço — '+empresa+'</h3></div>'+table(['OS','TAG','Tipo','Descrição','Técnico','Status'],d.os)+'</div>'}else if(id==='pcm'){h='<div class="panel"><div class="head"><h3>Planejamento / PCM — '+empresa+'</h3></div>'+table(['Data','TAG','Tipo','Serviço','Responsável','Prioridade','Status'],d.pcm)+'</div>'}else if(id==='estoque'){h='<div class="panel"><div class="head"><h3>Peças & Estoque — '+empresa+'</h3></div>'+table(['Código','Item','Qtd.','Mínimo','Custo'],d.estoque.map(x=>[...x,x[2]<x[3]?'<span class="badge danger">CRÍTICO</span>':'<span class="badge ok">NORMAL</span>']))+'</div>'}else if(id==='historico'){h='<div class="panel"><div class="head"><h3>Falhas & Histórico — '+empresa+'</h3></div>'+table(['Data/Hora','TAG','Tipo','Serviço','Peça','Custo'],d.historico)+'</div>'}document.getElementById('app').innerHTML='<section id="dashboard" class="tabs '+(id==='dashboard'?'active':'')+'"></section><section id="equipamentos" class="tabs '+(id==='equipamentos'?'active':'')+'"></section><section id="os" class="tabs '+(id==='os'?'active':'')+'"></section><section id="pcm" class="tabs '+(id==='pcm'?'active':'')+'"></section><section id="estoque" class="tabs '+(id==='estoque'?'active':'')+'"></section><section id="historico" class="tabs '+(id==='historico'?'active':'')+'"></section>';document.getElementById(id).innerHTML=h;if(id==='equipamentos')document.getElementById('eqform').onsubmit=e=>{e.preventDefault();d.equipamentos.push([e1.value,e2.value,e3.value,+e4.value,+e5.value]);save();render(id)}}function trocarEmpresa(){empresa=empresa==='SENAI'?'VALE':'SENAI';document.getElementById('empresa').textContent=empresa;render('dashboard')}function logout(){sessionStorage.removeItem('operantisSession');location.href='login.html'}document.getElementById('empresa').textContent=empresa;document.getElementById('switch').classList.toggle('show',sess.role==='admin');render('dashboard');</script></body></html>
