<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Sistema Operantis 4.0</title><style>:root{--blue:#0056b3;--dark:#003d82;--bg:#f4f6f9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:#263238}.box{width:min(420px,92vw);background:#fff;padding:32px;border-radius:12px;box-shadow:0 8px 30px #0002}.brand{text-align:center;margin-bottom:25px}.brand h1{margin:0;color:var(--dark)}.brand p{color:#6c757d}.field{margin:14px 0}.field label{display:block;font-weight:700;font-size:.85rem;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #ccd2d7;border-radius:6px;font-size:1rem}.btn{width:100%;padding:12px;border:0;border-radius:6px;background:var(--blue);color:#fff;font-weight:700;font-size:1rem;cursor:pointer}.error{display:none;background:#f8d7da;color:#842029;padding:10px;border-radius:6px;margin-bottom:14px}.hint{margin-top:20px;font-size:.78rem;color:#6c757d;text-align:center}</style></head><body><main class="box"><div class="brand"><h1>🔧 Sistema Operantis 4.0</h1><p>Acesso ao sistema de manutenção</p></div><div id="error" class="error">Usuário ou senha inválidos.</div><form id="login"><div class="field"><label for="user">Usuário</label><input id="user" autocomplete="username" required></div><div class="field"><label for="pass">Senha</label><input id="pass" type="password" autocomplete="current-password" required></div><button class="btn">Entrar</button></form><div class="hint">Selecione a conta correspondente à sua empresa ou ao administrador.</div></main><script src="auth-local.js"></script></body></html>
