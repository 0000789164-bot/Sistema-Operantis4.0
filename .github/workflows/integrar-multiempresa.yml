name: Integrar login multiempresa

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrar camada de autenticação ao aplicativo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          # Impede o fluxo legado de login anônimo. A camada multiempresa assume o Firebase Auth.
          s = s.replace('async function initFirebase(){try{', 'async function initFirebase(){return;try{', 1)
          if 'auth-multiempresa.js' not in s:
              s = s.replace('</body>', '<script src="auth-multiempresa.js"></script></body>', 1)
          p.write_text(s)
          PY
      - name: Validar integração
        run: |
          test -f auth-multiempresa.js
          grep -q 'auth-multiempresa.js' index.html
          grep -q 'async function initFirebase(){return;' index.html
      - name: Publicar alterações
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat: activate multi-company login in app'
          git push
