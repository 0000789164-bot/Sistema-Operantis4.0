name: Deploy Preview Login

on:
  push:
    branches: [interface-login-2-empresas-admin]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview-login
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout da branch de login
        uses: actions/checkout@v4

      - name: Criar entrada do Pages apontando para o login
        run: |
          cp login.html index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar preview
        id: deployment
        uses: actions/deploy-pages@v4
